name: Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: jvmTest
            os: ubuntu-latest

          - target: testAndroidHostTest
            os: ubuntu-latest

          - target: macosArm64Test
            os: macos-latest

          - target: iosSimulatorArm64Test
            os: macos-latest

          - target: iosX64Test
            os: macos-latest

          - target: watchosSimulatorArm64Test
            os: macos-latest

          - target: tvosSimulatorArm64Test
            os: macos-latest

          - target: mingwX64Test
            os: windows-latest

          - target: linuxX64Test
            os: ubuntu-latest

          - target: jsNodeTest
            os: ubuntu-latest

          - target: wasmJsNodeTest
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Native
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/*.kt') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run tests
        run: ./gradlew ${{ matrix.target }} --no-configuration-cache
  build-only:
    name: Build only (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linkDebugTestAndroidNativeArm64
            os: ubuntu-latest

          - target: linkDebugTestAndroidNativeX64
            os: ubuntu-latest

          - target: compileKotlinIosArm64
            os: macos-latest

          - target: compileKotlinWatchosDeviceArm64
            os: macos-latest

          - target: compileKotlinTvosArm64
            os: macos-latest

          - target: compileKotlinLinuxArm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Native
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/*.kt') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Compile target
        run: ./gradlew ${{ matrix.target }} --no-configuration-cache

  coverage:
    name: JVM Coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ test, build-only ]
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate JVM coverage report
        run: ./gradlew jvmTest koverXmlReportJvm --no-configuration-cache

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: retrykt/build/reports/kover/reportJvm.xml
          fail_ci_if_error: true
